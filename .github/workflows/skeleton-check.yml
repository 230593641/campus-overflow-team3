# 骨架绿灯流水线：只验证"结构没坏"，不跑 TODO 测试
# 与 ci.yml 的分工：ci.yml 是全量目标（现在红是预期），本流水线是日常门禁（必须绿）
name: skeleton-check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend-skeleton:
    name: skeleton-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 配置 JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: 安装全部模块（跳过测试，仅让兄弟模块可被解析）
        run: mvn -B -f backend/pom.xml -DskipTests install

      - name: 架构约束检查（ArchUnit）
        run: mvn -B -f backend/pom.xml test -pl co-bootstrap -Dtest=ArchitectureTest -DfailIfNoTests=false

      - name: 参考实现测试（Identity + Shared Kernel，必须绿）
        run: mvn -B -f backend/pom.xml test -pl co-identity/co-identity-domain,co-shared-kernel -DfailIfNoTests=false

  frontend-check:
    name: frontend-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: 安装依赖
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: 类型检查
        working-directory: frontend
        run: npm run typecheck
      - name: 构建
        working-directory: frontend
        run: npm run build
